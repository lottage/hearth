[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hearth"
version = "0.1.0rc8"
description = "Home app for StoneSage: Computer, a sarcastic British attic computer that runs a Home Assistant house."
readme = "README.md"
requires-python = ">=3.10"
license = "Unlicense"
license-files = ["LICENSE"]
dependencies = [
  "lodestone @ git+https://github.com/lottage/lodestone@v0.1.0-rc.8",
  "stonesage @ git+https://github.com/lottage/stonesage@v0.1.0-rc.8",
  "websockets>=12.0",
  "redis>=5.0.0",
  "Pillow>=10.0.0"
]

[project.urls]
Homepage = "https://github.com/lottage/hearth"

[tool.setuptools.packages.find]
include = ["hearth*"]
